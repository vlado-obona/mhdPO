name: Prieskum GTFS (SK mestá)

# Jednorazový prieskum: ktoré slovenské mestá zverejňujú cestovné poriadky
# MHD vo formáte GTFS. Výsledky len do logu (nič sa necommituje).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: ArcGIS / národný katalóg / weby dopravných podnikov
        run: |
          set +e
          UA="Mozilla/5.0 (X11; Linux x86_64) Chrome/128 Safari/537.36"
          j() { curl -sSL -A "$UA" --max-time 60 "$1"; }
          echo "===== ArcGIS Online: položky s GTFS (SK)"
          for q in 'GTFS%20Ko%C5%A1ice' 'GTFS%20%C5%BDilina' 'GTFS%20Bansk%C3%A1%20Bystrica' 'GTFS%20Nitra' 'GTFS%20Trnava' 'GTFS%20Tren%C4%8D%C3%ADn' 'GTFS%20Martin' 'GTFS%20Poprad' 'GTFS%20MHD' 'cestovn%C3%BD%20poriadok%20GTFS' 'GTFS%20Slovensko'; do
            echo "--- q=$q"
            j "https://www.arcgis.com/sharing/rest/search?q=$q&num=30&f=json" | python3 -c "
          import json,sys
          try: d=json.load(sys.stdin)
          except Exception as e: print('ERR',e); sys.exit()
          for r in d.get('results',[]): print(r['id'],'|',r.get('type'),'|',r.get('title'),'|',r.get('owner'),'|',(r.get('url') or ''))"
          done
          echo "===== Košice opendata item ba941d7bc56a462684a261d4f35ce17d"
          j "https://www.arcgis.com/sharing/rest/content/items/ba941d7bc56a462684a261d4f35ce17d?f=json" | python3 -c "
          import json,sys;d=json.load(sys.stdin);print({k:d.get(k) for k in ['title','type','name','size','modified','licenseInfo','description','url','typeKeywords']})"
          curl -sSL -A "$UA" --max-time 120 -o ke.bin "https://www.arcgis.com/sharing/rest/content/items/ba941d7bc56a462684a261d4f35ce17d/data"; file ke.bin; ls -la ke.bin; (unzip -l ke.bin 2>/dev/null | head -30) || head -c 600 ke.bin
          echo "===== data.slovensko.sk hľadanie"
          for q in gtfs "cestovny poriadok" mhd; do
            echo "--- $q"
            j "https://data.slovensko.sk/api/3/action/package_search?q=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$q")&rows=60" | python3 -c "
          import json,sys
          try: d=json.load(sys.stdin)
          except Exception as e: print('ERR (nie CKAN API?)',e); sys.exit()
          for p in d.get('result',{}).get('results',[]): print(p.get('name'),'|',p.get('title'),'|',(p.get('organization') or {}).get('title'),'|',[ (r.get('format'),r.get('url')) for r in p.get('resources',[])][:3])"
            j "https://data.slovensko.sk/datasety?q=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$q")" | grep -oiE 'href="/datasety/[^"]+"[^>]*>[^<]{0,120}' | head -40
          done
          echo "===== weby dopravných podnikov (zmienky o GTFS / open data)"
          for u in https://www.dpmk.sk https://www.dpmz.sk https://www.dpmbb.sk https://dpmbb.sk https://www.dpmp.sk https://www.mhdnitra.sk https://www.arriva.sk https://www.sadtn.sk https://www.mhdtrnava.sk https://www.dpmk.sk/cp https://opendata.kosice.sk; do
            echo "--- $u"; j "$u" | grep -oiE '.{0,80}(gtfs|open ?data|otvoren[ée] d[áa]ta).{0,80}' | head -8
          done
