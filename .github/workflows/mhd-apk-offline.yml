name: Android (APK + AAB)

# Zabalí plánovač „Odkiaľ Kam“ (mhd-app/) do Android aplikácie (Capacitor 8,
# targetSdk 36 — požiadavka Google Play od 31. 8. 2026): web aj dáta sú
# VNÚTRI aplikácie. Balíček sk.operatorsystem.mhdpresov (Google Play — po
# prvom nahratí sa nedá zmeniť). Výsledok commitne do releases/v<verzia>/
# a pridá do GitHub Release v<verzia>:
#   mhd-presov-v<verzia>.apk  — na priamu inštaláciu (sideload)
#   mhd-presov-v<verzia>.aab  — na nahratie do Google Play Console
# Oba sú podpísané tým istým kľúčom zo secrets ANDROID_KEYSTORE_B64 +
# ANDROID_KEYSTORE_PASSWORD (alias „android“) = upload kľúč pre Google Play.
# Bez nich build ZLYHÁ — nikdy sa nepodpisuje iným kľúčom. Verzia sa berie
# z APP_VERSION v mhd-app/app.js (alebo z parametra pri ručnom spustení).
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mhd-apk-offline.yml'
      - 'android-native/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Verzia (prázdne = APP_VERSION z mhd-app/app.js)'
        required: false
        type: string
      play_track:
        description: 'Google Play: kam nahrať AAB (internal = interné testovanie, none = nenahrávať)'
        required: false
        default: 'internal'
        type: choice
        options: [internal, none]

permissions:
  contents: write

concurrency:
  group: mhd-apk-offline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verzia
        run: |
          V="${{ inputs.version }}"
          [ -n "$V" ] || V=$(sed -n "s/^const APP_VERSION = '\([0-9.]*\)';/\1/p" mhd-app/app.js)
          echo "VERSION=$V" >> "$GITHUB_ENV"; echo "verzia $V"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Capacitor projekt
        run: |
          mkdir cap-build && cd cap-build
          npm init -y >/dev/null
          npm i --no-audit --no-fund @capacitor/core@8.5.2 @capacitor/cli@8.5.2 @capacitor/android@8.5.2 @capacitor/geolocation@8.2.2 @capacitor/local-notifications@8.3.1 @capacitor/haptics@8.0.2 @capacitor/app@8.1.2 @capacitor-community/keep-awake@8.0.1 @capacitor-community/text-to-speech@8.0.2 @capgo/native-purchases@8.8.1 >/dev/null
          cat > capacitor.config.json <<EOF
          {
            "appId": "sk.operatorsystem.mhdpresov",
            "appName": "Odkiaľ Kam v$VERSION",
            "webDir": "www",
            "android": { "allowMixedContent": false }
          }
          EOF
          cp -r ../mhd-app www
          grep -q "APP_VERSION = '$VERSION'" www/app.js || { echo "::error::APP_VERSION v app.js nesedí s $VERSION"; exit 1; }
          npx cap add android
          npx cap sync android
          grep -E 'targetSdkVersion|compileSdkVersion' android/variables.gradle
          grep -q 'targetSdkVersion = 36' android/variables.gradle || { echo "::error::targetSdk nie je 36 (Google Play)"; exit 1; }
          # oprávnenia: geolokácia (len pri používaní appky), nákup Plus cez Google Play Billing. Presné upozornenie na výstup:
          # SCHEDULE_EXACT_ALARM pridáva plugin LocalNotifications (USE_EXACT_ALARM Google Play
          # povoľuje len budíkom/kalendárom — nepoužívame).
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n    <uses-permission android:name="com.android.vending.BILLING" />\n</manifest>#' "$M"
          grep -c LOCATION "$M"
          # widget „Najbližší autobus“ (Odkiaľ Kam Plus): natívny kód z android-native/
          cp -r ../android-native/app/src/main/. android/app/src/main/
          sed -i 's#</application>#    <receiver android:name=".NextBusWidget" android:exported="false" android:label="@string/widget_label">\n            <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter>\n            <meta-data android:name="android.appwidget.provider" android:resource="@xml/next_bus_widget_info" />\n        </receiver>\n    </application>#' "$M"
          grep -q 'NextBusWidget' "$M" || { echo "::error::widget nie je v AndroidManifest"; exit 1; }
          # Play Billing Library posiela diagnostiku o volaniach billing API do Google
          # (datatransport/CCT). Appka nemá zbierať žiadne údaje (Data safety „nezbiera“),
          # preto sa odosielač (backend CCT) z manifestu odstráni — logger knižnice je
          # celý v try/catch, udalosti ostanú bez backendu a zahodia sa; nákupy fungujú.
          grep -q 'xmlns:tools=' "$M" || sed -i 's#<manifest #<manifest xmlns:tools="http://schemas.android.com/tools" #' "$M"
          sed -i 's#</application>#    <service android:name="com.google.android.datatransport.runtime.backends.TransportBackendDiscovery" tools:node="remove" />\n    </application>#' "$M"
          grep -q 'TransportBackendDiscovery' "$M" || { echo "::error::odstránenie diagnostiky nie je v AndroidManifest"; exit 1; }
          grep -q 'registerPlugin(WidgetBridgePlugin.class)' android/app/src/main/java/sk/operatorsystem/mhdpresov/MainActivity.java || { echo "::error::MainActivity bez WidgetBridge"; exit 1; }

      - name: Ikony aplikacie
        working-directory: cap-build
        run: |
          npm i --no-audit --no-fund -D @capacitor/assets sharp >/dev/null
          mkdir -p assets
          node -e "const s=require('sharp'); s('../mhd-app/icons/icon-512.png').resize(1024,1024).png().toFile('assets/logo.png').then(()=>console.log('logo ok'))"
          npx capacitor-assets generate --android || echo "generovanie ikon zlyhalo — ostane predvolena"

      - name: Verzia aplikacie
        working-directory: cap-build/android
        run: |
          # versionCode musí stále rásť (Google Play aj aktualizácia v telefóne):
          # (YYMMDD)*1000 + minúta dňa/2 → napr. 261002*1000+417; je vyššie než
          # doterajšie 20261001 a pod limitom 2 100 000 000
          D=$(date -u +%y%m%d); HM=$(( 10#$(date -u +%H) * 60 + 10#$(date -u +%M) ))
          CODE=$(( 10#$D * 1000 + HM / 2 ))
          sed -i "s/versionCode 1$/versionCode $CODE/" app/build.gradle
          sed -i "s/versionName \"1.0\"$/versionName \"$VERSION\"/" app/build.gradle
          grep -E 'versionCode|versionName' app/build.gradle

      - name: Build release APK + AAB
        working-directory: cap-build/android
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Podpis APK a AAB
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd cap-build
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS_SECRET" ]; then
            echo "::error::Chýbajú secrets ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD — bez stáleho kľúča sa nepodpisuje."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > android.keystore
          KS_PASS="$KS_PASS_SECRET"
          echo "::add-mask::$KS_PASS"
          # odtlačok certifikátu je verejný údaj — musí sedieť s kľúčom v Play Console
          keytool -list -v -keystore android.keystore -storepass "$KS_PASS" -alias android | grep -E 'SHA256:|Valid'
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks android.keystore --ks-key-alias android \
            --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" \
            --out mhd-presov-offline.apk aligned.apk
          "$BT/apksigner" verify mhd-presov-offline.apk && echo "APK podpis OK"
          # výsledné APK nesmie obsahovať odosielač diagnostiky (Data safety „nezbiera“)
          if "$BT/aapt2" dump xmltree --file AndroidManifest.xml mhd-presov-offline.apk | grep -qE 'TransportBackendDiscovery|CctBackendFactory'; then
            echo "::error::APK obsahuje datatransport backend (diagnostika do Google)"; exit 1
          fi
          echo "datatransport backend: odstránený"
          cp android/app/build/outputs/bundle/release/app-release.aab mhd-presov.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore android.keystore \
            -storepass "$KS_PASS" -keypass "$KS_PASS" mhd-presov.aab android
          jarsigner -verify mhd-presov.aab | tail -1
          rm -f android.keystore aligned.apk

      - name: Commit APK + AAB do releases
        run: |
          mkdir -p "releases/v$VERSION"
          cp cap-build/mhd-presov-offline.apk "releases/v$VERSION/mhd-presov-v$VERSION.apk"
          cp cap-build/mhd-presov.aab "releases/v$VERSION/mhd-presov-v$VERSION.aab"
          # appka v jednom súbore (.html) — ak ešte nie je v repe, zostaví sa tu
          H="releases/v$VERSION/mhd-presov-v$VERSION.html"
          [ -f "$H" ] || node scripts/mhd/build-release.mjs "$VERSION" || echo "::warning::HTML release sa nepodarilo zostaviť"
          [ -f "$H" ] && git add "$H" "releases/v$VERSION/RELEASE.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "releases/v$VERSION/mhd-presov-v$VERSION.apk" "releases/v$VERSION/mhd-presov-v$VERSION.aab"
          if git diff --cached --quiet; then
            echo "APK/AAB bez zmeny."
          else
            git commit -m "mhd: Android APK + AAB v$VERSION ($(date -u +%F))"
            for n in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push && break; sleep 5; done
          fi

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub Release v<verzia> — vytvorí ho prvý workflow, ďalší len pridajú súbory
          rel() {
            for n in 1 2 3; do
              gh release view "v$VERSION" >/dev/null 2>&1 || gh release create "v$VERSION" --title "Odkiaľ Kam v$VERSION" \
                --notes "Popis zmien: releases/CHANGELOG.txt. Súbory: .apk (Android, priama inštalácia), .aab (Google Play), .html (appka v jednom súbore), -ios.ipa (iOS, nepodpísaná)." || true
              gh release upload "v$VERSION" "$@" --clobber && return 0
              sleep 10
            done; return 1
          }
          F=("releases/v$VERSION/mhd-presov-v$VERSION.apk" "releases/v$VERSION/mhd-presov-v$VERSION.aab")
          [ -f "releases/v$VERSION/mhd-presov-v$VERSION.html" ] && F+=("releases/v$VERSION/mhd-presov-v$VERSION.html")
          rel "${F[@]}"

      # ── Google Play: automatické nahratie AAB do interného testovania ──
      # Potrebuje secret PLAY_SERVICE_ACCOUNT_JSON (servisný účet Google Cloud
      # s prístupom „Vydania“ v Play Console). Bez neho sa krok preskočí.
      # Prvé vydanie musí byť v Play Console nahraté ručne (API appku nevytvorí).
      # Do produkcie sa verzia posúva ručne v Play Console (Propagovať vydanie).
      - name: Google Play – príprava
        id: play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TRACK: ${{ inputs.play_track || 'internal' }}
        run: |
          if [ -z "$PLAY_JSON" ]; then
            echo "::notice::Secret PLAY_SERVICE_ACCOUNT_JSON nie je nastavený – nahratie do Google Play preskočené."
            echo "enabled=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$PLAY_TRACK" = "none" ]; then echo "enabled=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "track=$PLAY_TRACK" >> "$GITHUB_OUTPUT"
          # „Čo je nové“ (max. 500 znakov) z releases/CHANGELOG.txt
          mkdir -p whatsnew
          python3 - "$VERSION" <<'PY'
          import re, sys
          v = sys.argv[1]
          txt = open('releases/CHANGELOG.txt', encoding='utf-8').read()
          m = re.search(r'^v' + re.escape(v) + r'\b.*?\n-+\n(.*?)(?=\n-{10,}\nv\d|\Z)', txt, re.S | re.M)
          body = m.group(1).strip() if m else f'Verzia {v}.'
          body = re.sub(r'[ \t]*\n[ \t]+', ' ', body)          # zalomené riadky odrážok spojiť
          body = re.sub(r'\n{2,}', '\n', body).strip()
          if len(body) > 500: body = body[:497].rsplit(' ', 1)[0] + '…'
          # Play prijme len jazykový tag „sk“, nie „sk-SK“
          open('whatsnew/whatsnew-sk', 'w', encoding='utf-8').write(body)
          print(body)
          PY

      - name: Google Play – nahratie (interné testovanie)
        id: upload
        if: steps.play.outputs.enabled == 'true'
        continue-on-error: true
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: sk.operatorsystem.mhdpresov
          releaseFiles: releases/v${{ env.VERSION }}/mhd-presov-v${{ env.VERSION }}.aab
          releaseName: ${{ env.VERSION }}
          track: ${{ steps.play.outputs.track }}
          status: completed
          whatsNewDirectory: whatsnew

      # appka, ktorá ešte nemá žiadne zverejnené vydanie, prijme len koncept
      - name: Google Play – nahratie ako koncept
        if: steps.play.outputs.enabled == 'true' && steps.upload.outcome == 'failure'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: sk.operatorsystem.mhdpresov
          releaseFiles: releases/v${{ env.VERSION }}/mhd-presov-v${{ env.VERSION }}.aab
          releaseName: ${{ env.VERSION }}
          track: ${{ steps.play.outputs.track }}
          status: draft
          whatsNewDirectory: whatsnew
