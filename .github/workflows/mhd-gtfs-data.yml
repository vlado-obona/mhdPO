name: Cestovné poriadky (GTFS)

# Stiahne oficiálny GTFS feed MHD Prešov (DPMP), skompiluje dataset pre
# plánovač a commitne zmeny. Spúšťa sa ručne alebo denne (cestovné
# poriadky sa menia). Pri zmene feedu treba vydať novú verziu appky
# (APP_VERSION + Android/iOS workflow) — Google Play verzia sa sama neaktualizuje.
# Opravy z data/gtfs-patches/ platia len pre feed, pre ktorý boli vytvorené.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mhd-gtfs-data.yml'
      - 'scripts/mhd/fetch-gtfs.sh'
  workflow_dispatch:
    inputs:
      gtfs_url:
        description: 'Priama URL na GTFS zip (voliteľné — inak autodetekcia)'
        required: false
        type: string
  schedule:
    - cron: '45 2 * * *' # denne 02:45 UTC — cestovné poriadky sa môžu meniť

permissions:
  contents: write
  actions: write # spustenie web workflow po aktualizácii dát

concurrency:
  group: mhd-gtfs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Stiahnut GTFS feed
        env:
          GTFS_URL: ${{ inputs.gtfs_url }}
        run: bash scripts/mhd/fetch-gtfs.sh

      - name: Skompilovat dataset pre planovac
        run: |
          # dataset.json obsahuje cas generovania — kompiluj len pri zmene
          # surovych dat, inak by kazdy beh vytvoril zbytocny commit
          if git status --porcelain data/gtfs-presov | grep -q .; then
            node scripts/mhd/build-data.mjs
          else
            echo "GTFS bez zmeny - dataset sa nekompiluje."
          fi

      - name: Commit a push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/gtfs-presov || true
          git add -A mhd-app/data 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Ziadne zmeny v datach."
          else
            git commit -m "mhd: aktualizacia GTFS dat DPMP ($(date -u +%F))"
            git push
            echo "::warning::Nové GTFS dáta — over ich a vydaj novú verziu appky."
            # push cez GITHUB_TOKEN nespusti web workflow — spusti ho explicitne
            if [ "${GITHUB_REF_NAME}" = "main" ]; then
              gh workflow run pages.yml --ref main || echo "Web sa nepodarilo zverejnit."
            fi
          fi
        env:
          GH_TOKEN: ${{ github.token }}
