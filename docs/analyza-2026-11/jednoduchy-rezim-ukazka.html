<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jednoduchý režim – ukážka návrhu (Odkiaľ Kam)</title>
<style>
  :root {
    --green: #075c2b;        /* tmavšia zelená: biely text 8,3:1 */
    --green-soft: #e6f3ea;
    --ink: #14181a;
    --muted: #454c50;        /* 8,6:1 na bielej */
    --bg: #f2f5f2;
    --card: #ffffff;
    --line: #7d887f;         /* okraje 3,7:1 */
    --warn-bg: #fff3d6;
    --warn-ink: #5a3d00;
    --red: #a3210f;
    --blue: #0b4a8f;
    --r: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 1.125rem/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; /* 18 px */
    color: var(--ink); background: #dfe6e0;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 4px solid #ffbf00; outline-offset: 3px; }
  [hidden] { display: none !important; }

  /* rám telefónu na širokej obrazovke, na mobile celá plocha */
  .stage { height: 100vh; height: 100dvh; display: flex; flex-direction: column; align-items: center; }
  .demo {
    width: 100%; background: #1d2a22; color: #fff; padding: .3rem .6rem; flex: none;
    display: flex; flex-wrap: nowrap; gap: .5rem; align-items: center; justify-content: center; font-size: .95rem;
  }
  .demo b { font-weight: 700; }
  .demo button {
    min-height: 40px; padding: .2rem .8rem; border-radius: 999px; border: 2px solid #9fc9ad;
    background: transparent; color: #fff; font-weight: 600; white-space: nowrap;
  }
  .demo button[aria-pressed="true"] { background: #fff; color: #1d2a22; border-color: #fff; }
  .phone {
    position: relative; width: 100%; max-width: 430px; flex: 1 1 auto; min-height: 0;
    background: var(--bg); display: flex; flex-direction: column; overflow: hidden;
  }
  .demo .d-long { display: none; }
  @media (min-width: 700px) {
    .stage { height: auto; min-height: 100%; }
    .demo { padding: .5rem .75rem; } .demo .d-long { display: inline; } .demo .d-short { display: none; }
    .phone { flex: none; height: 800px; margin: 1rem 0 2rem; border-radius: 28px; box-shadow: 0 12px 40px rgb(0 0 0 / 25%); }
  }

  .screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .scroll { flex: 1; overflow-y: auto; padding: 1rem 1rem 1.25rem; }
  .bar-top {
    background: var(--green); color: #fff; padding: .9rem 1rem; display: flex; align-items: center; gap: .75rem;
  }
  .bar-top h1 { font-size: 1.6rem; line-height: 1.15; margin: 0; flex: 1; }
  .bar-top .clock { font-size: 1.05rem; font-weight: 600; text-align: right; line-height: 1.2; }
  .btn-text {
    min-height: 56px; padding: .5rem 1rem; border-radius: 14px; border: 2px solid #fff; background: transparent; color: #fff; font-weight: 700;
  }

  /* dlaždice cieľov */
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile {
    min-height: 132px; border: 0; border-radius: var(--r); color: #fff; padding: .75rem .5rem;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .15rem;
    box-shadow: 0 3px 0 rgb(0 0 0 / 22%);
  }
  .tile .ico { font-size: 2.6rem; line-height: 1; }
  .tile .name { font-size: 1.6rem; font-weight: 800; line-height: 1.15; }
  .tile .sub { font-size: 1rem; font-weight: 600; text-align: center; overflow-wrap: anywhere; }
  .tile.wide { grid-column: 1 / -1; min-height: 104px; flex-direction: row; gap: 1rem; }
  .tile.wide .txt { display: flex; flex-direction: column; align-items: flex-start; }
  .t-home { background: #075c2b; } .t-school { background: #0b4a8f; } .t-doc { background: #8a1c3c; }
  .t-gran { background: #6a3d00; } .t-shop { background: #4b2a80; }
  .row-btn {
    width: 100%; min-height: 64px; margin-top: 12px; border-radius: var(--r); border: 2px solid var(--line);
    background: var(--card); font-weight: 700; font-size: 1.2rem; display: flex; align-items: center; gap: .75rem; padding: .6rem 1rem; text-align: left;
  }
  .row-btn .ico { font-size: 1.7rem; }
  .row-btn small { display: block; font-weight: 500; font-size: 1rem; color: var(--muted); }

  /* spodná lišta pomoci – vždy viditeľná */
  .help {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 1rem calc(12px + env(safe-area-inset-bottom));
    background: var(--card); border-top: 2px solid #c9d2cb;
  }
  .help button {
    min-height: 64px; border-radius: 16px; border: 2px solid var(--green); background: var(--card); color: var(--green);
    font-weight: 800; font-size: 1.15rem; display: flex; align-items: center; justify-content: center; gap: .5rem; padding: .4rem .5rem; line-height: 1.15; text-align: left;
  }
  .help button .ico { font-size: 1.6rem; flex: none; }
  .help button small { display: block; font-size: 1rem; font-weight: 600; }
  .help button.call { background: var(--blue); border-color: var(--blue); color: #fff; }

  /* plán – jedna odpoveď */
  .leave { background: var(--card); border-radius: var(--r); padding: 1rem; border: 2px solid #c9d2cb; }
  .leave .lbl { font-size: 1.15rem; font-weight: 700; color: var(--muted); }
  .leave .big { font-size: 3rem; font-weight: 800; line-height: 1.05; }
  .leave .in { font-size: 1.25rem; font-weight: 700; color: var(--green); }
  .leave .bus { font-size: 1.2rem; margin-top: .5rem; line-height: 1.5; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin: .75rem 0 0; }
  .tag { background: var(--green-soft); color: var(--green); font-weight: 700; border-radius: 999px; padding: .3rem .8rem; font-size: 1.05rem; }
  .tag.warn { background: var(--warn-bg); color: var(--warn-ink); }
  ol.steps { list-style: none; margin: 1rem 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  ol.steps li { background: var(--card); border-radius: var(--r); padding: .85rem 1rem; display: flex; gap: .85rem; align-items: flex-start; border: 2px solid #c9d2cb; }
  ol.steps .ico { font-size: 2rem; line-height: 1.1; width: 2.4rem; text-align: center; flex: none; }
  ol.steps .main { font-size: 1.3rem; font-weight: 700; line-height: 1.25; }
  ol.steps .sub { font-size: 1.1rem; color: var(--muted); }
  .line-badge { display: inline-block; min-width: 2.6rem; text-align: center; background: var(--green); color: #fff; font-weight: 800; border-radius: 10px; padding: .05rem .5rem; font-size: 1.5rem; }
  .actions { padding: 12px 1rem; background: var(--card); border-top: 2px solid #c9d2cb; display: flex; flex-direction: column; gap: 10px; }
  .primary {
    min-height: 72px; border: 0; border-radius: 18px; background: var(--green); color: #fff; font-size: 1.5rem; font-weight: 800; width: 100%;
    box-shadow: 0 3px 0 rgb(0 0 0 / 25%);
  }
  .secondary { min-height: 60px; border-radius: 16px; border: 2px solid var(--green); background: var(--card); color: var(--green); font-size: 1.2rem; font-weight: 700; width: 100%; }
  .danger { color: var(--red); border-color: var(--red); }

  /* sprevádzanie */
  .dots { display: flex; gap: 6px; padding: .6rem 1rem 0; }
  .dots span { flex: 1; height: 10px; border-radius: 5px; background: #c3cdc5; }
  .dots span.on { background: var(--green); }
  .now { background: var(--card); border-radius: var(--r); padding: 1.1rem 1rem; border: 3px solid var(--green); text-align: center; }
  .now .ico { font-size: 3.4rem; line-height: 1; }
  .now h2 { font-size: 1.9rem; line-height: 1.15; margin: .4rem 0 .3rem; }
  .now p { margin: .2rem 0; font-size: 1.3rem; }
  .now .ok { color: var(--green); font-weight: 800; }
  .now .count { font-size: 3.2rem; font-weight: 800; line-height: 1; }
  .next { margin-top: 12px; background: #e9eeea; border-radius: var(--r); padding: .8rem 1rem; font-size: 1.1rem; color: var(--muted); }
  .next b { color: var(--ink); }

  /* upozornenie na výstup – ako v appke: celá obrazovka */
  .alert { position: absolute; inset: 0; background: var(--red); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 1.5rem; z-index: 20; }
  .alert .ico { font-size: 5rem; }
  .alert h2 { font-size: 2.3rem; line-height: 1.1; margin: .5rem 0; }
  .alert p { font-size: 1.5rem; font-weight: 700; margin: .3rem 0 1.5rem; }
  .alert button { min-height: 76px; min-width: 240px; border: 0; border-radius: 18px; background: #fff; color: var(--red); font-size: 1.5rem; font-weight: 800; }

  /* hárky a dialógy */
  .veil { position: absolute; inset: 0; background: rgb(0 0 0 / 55%); z-index: 30; display: flex; align-items: flex-end; }
  .sheet { background: var(--card); width: 100%; border-radius: 24px 24px 0 0; padding: 1.25rem 1rem calc(1rem + env(safe-area-inset-bottom)); max-height: 92%; overflow-y: auto; }
  .sheet h2 { font-size: 1.7rem; margin: 0 0 .5rem; line-height: 1.2; }
  .sheet p { font-size: 1.25rem; margin: .4rem 0; }
  .sheet .stack { display: flex; flex-direction: column; gap: 10px; margin-top: 1rem; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-top: .9rem; font-weight: 700; }
  .field select, .field input { min-height: 56px; font: inherit; border-radius: 12px; border: 2px solid var(--line); padding: .4rem .7rem; background: #fff; }
  .note { font-size: 1rem; color: var(--muted); margin-top: .9rem; }
  .big-msg { text-align: center; padding: 1.2rem .5rem; }
  .big-msg .ico { font-size: 4rem; }
  .big-msg h2 { font-size: 2rem; line-height: 1.15; margin: .4rem 0; }
  .big-msg p { font-size: 1.35rem; margin: .4rem 0; }
  /* navádzanie pešo na zastávku */
  .walk { background: var(--card); border-radius: var(--r); padding: .7rem .9rem .85rem; border: 3px solid var(--green); }
  .walk.bad { border-color: var(--red); background: #fff4f1; }
  .w-lbl { margin: 0; font-size: 1.15rem; font-weight: 700; color: var(--muted); }
  .plate { display: inline-flex; align-items: center; gap: .5rem; margin-top: .25rem; padding: .15rem .7rem .15rem .35rem; border: 3px solid var(--ink); border-radius: 10px; background: #fff; font-weight: 800; font-size: 1.4rem; letter-spacing: .02em; text-transform: uppercase; line-height: 1.2; }
  .plate .pi { background: var(--blue); border-radius: 6px; padding: 0 .25rem; font-size: 1.3rem; }
  .w-row { display: flex; align-items: center; gap: 1rem; margin-top: .65rem; }
  .compass { flex: none; width: 104px; height: 104px; border-radius: 50%; border: 5px solid var(--green); background: var(--green-soft); display: grid; place-items: center; }
  .compass svg { width: 72px; height: 72px; transition: transform .5s ease; fill: var(--green); }
  .compass.sm { width: 64px; height: 64px; border-width: 4px; } .compass.sm svg { width: 44px; height: 44px; }
  .compass.bus { border-color: #9a4a00; background: #fff1dd; } .compass.bus svg { fill: #9a4a00; }
  .walk.bad .compass { border-color: var(--red); background: #ffe1d9; } .walk.bad .compass svg { fill: var(--red); }
  .w-dist b { display: block; font-size: 2.7rem; line-height: 1; font-weight: 800; white-space: nowrap; }
  .w-dist > span { display: block; margin-top: .2rem; font-size: 1.2rem; font-weight: 600; color: var(--muted); }
  .w-dist > span.ok { color: var(--green); font-weight: 800; }
  .w-say { margin: .6rem 0 0; font-size: 1.3rem; font-weight: 800; line-height: 1.25; }
  .walk.bad .w-say { color: var(--red); }
  .w-safe { margin: .45rem 0 0; font-size: 1rem; font-weight: 700; line-height: 1.3; color: var(--warn-ink); background: var(--warn-bg); border-radius: 10px; padding: .25rem .6rem; }
  .now .w-safe { text-align: left; font-size: 1.1rem; }
  .line-badge.sm { font-size: 1.1rem; min-width: 1.9rem; padding: 0 .35rem; border-radius: 7px; }
  .busdir { width: 108px; height: 108px; margin: .6rem auto .4rem; border-radius: 50%; border: 4px dashed var(--ink); background: #fff; display: grid; place-items: center; }
  .busdir svg { width: 78px; height: 78px; fill: var(--ink); transition: transform .5s ease; }
  .now .q { font-size: 1.5rem; font-weight: 700; }
  .actions { position: relative; }
  .more { display: none; position: absolute; top: 2px; left: 50%; transform: translateX(-50%); border: 0; background: var(--ink); color: #fff; border-radius: 999px; padding: 0 1rem; font-size: 1rem; line-height: 1.6; font-weight: 700; white-space: nowrap; }
  .screen.has-more .more { display: block; }
  .screen.has-more .actions { padding-top: 32px; }
  .pair.big .secondary { min-height: 72px; font-size: 1.35rem; font-weight: 800; }
  .now .pre { margin: 0 0 .15rem; font-size: 1.2rem; font-weight: 700; color: var(--muted); }
  .w-ok { margin-top: 10px; background: var(--green-soft); color: var(--green); font-weight: 800; border-radius: 14px; padding: .55rem .9rem; font-size: 1.15rem; line-height: 1.3; }
  .w-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .3rem .75rem; }
  .w-head > :first-child { flex: 1 1 8rem; min-width: 0; }
  .w-head b { display: block; font-size: 2rem; line-height: 1.05; font-weight: 800; }
  .sign { border: 3px solid var(--ink); border-radius: 12px; overflow: hidden; margin-top: .35rem; background: #fff; }
  .sign-top { background: var(--blue); color: #fff; padding: .3rem .7rem; font-weight: 800; font-size: 1.4rem; text-transform: uppercase; letter-spacing: .02em; display: flex; gap: .5rem; align-items: center; line-height: 1.2; }
  .sign-lines { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: .3rem .5rem; }
  .sign-lines span { min-width: 2.3rem; text-align: center; border: 2px solid var(--line); border-radius: 8px; font-weight: 700; padding: 0 .3rem; font-size: 1.05rem; color: var(--muted); }
  .sign-lines em { font-style: normal; font-weight: 600; font-size: 1rem; color: var(--muted); }
  .sign-lines span.on { background: var(--green); color: #fff; border-color: var(--green); font-size: 1.6rem; font-weight: 800; min-width: 2.9rem; }
  .warn-box { margin-top: 10px; background: var(--warn-bg); color: var(--warn-ink); border-radius: 14px; padding: .6rem .9rem; font-size: 1.1rem; font-weight: 600; border: 2px solid #b98a1e; line-height: 1.35; }
  .mapbox { margin-top: .5rem; border-radius: 14px; overflow: hidden; border: 2px solid var(--line); background: #dfe4dc; }
  .mapbox svg { display: block; width: 100%; height: auto; }
  .mapbox text { font: 700 16px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #263033; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; text-anchor: middle; dominant-baseline: central; }
  .legend { display: flex; flex-wrap: wrap; gap: .1rem .9rem; font-size: 1rem; font-weight: 700; color: var(--ink); margin: .4rem 0 0; padding: 0; list-style: none; }
  .legend i { display: inline-block; width: 1rem; height: 1rem; border-radius: 50%; vertical-align: -.12rem; margin-right: .3rem; }
  .legend .lg-me { background: #1a5fd0; } .legend .lg-st { background: #075c2b; border-radius: 3px; } .legend .lg-no { background: #5d6568; }
  .demo .sim { background: #ffd24a; color: #1d2a22; border-color: #ffd24a; font-weight: 800; }
  .demo.many { flex-wrap: wrap; row-gap: .3rem; gap: .35rem; } .demo.many > span { display: none; } .demo.many button { padding: .2rem .55rem; font-size: .9rem; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pair .secondary { font-size: 1.08rem; line-height: 1.2; padding: .3rem .5rem; }
  /* nízke displeje: menšie dlaždice, aby sa zmestili štyri ciele */
  @media (max-height: 700px) {
    .bar-top { padding: .6rem 1rem; } .bar-top h1 { font-size: 1.4rem; }
    .tile { min-height: 104px; } .tile .ico { font-size: 2rem; } .tile .name { font-size: 1.4rem; }
    .tile.wide { min-height: 76px; }
    .now { padding: .8rem .75rem; } .now .ico { font-size: 2.4rem; } .now h2 { font-size: 1.6rem; }
    .walk { padding: .55rem .75rem .7rem; } .compass { width: 96px; height: 96px; } .compass svg { width: 66px; height: 66px; }
    .w-dist b { font-size: 2.3rem; } .w-row { margin-top: .5rem; gap: .8rem; } .plate { font-size: 1.25rem; } .w-say { font-size: 1.2rem; margin-top: .45rem; }
    .dots { padding-top: .4rem; } .w-lbl { font-size: 1.05rem; } .busdir { width: 92px; height: 92px; } .busdir svg { width: 64px; height: 64px; }
    .primary { min-height: 64px; font-size: 1.35rem; } .actions { padding: 10px .75rem; gap: 8px; }
    .help { padding: 8px .75rem calc(8px + env(safe-area-inset-bottom)); } .help button { min-height: 60px; }
    .scroll { padding: .75rem .75rem 1rem; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="demo" role="group" aria-label="Ovládanie ukážky">
    <span class="d-long"><b>Ukážka návrhu</b> · reálne spoje zo štvrtka 12. 11. 2026</span><span class="d-short"><b>Ukážka</b></span>
    <button id="demoDay" aria-pressed="true">Ráno 7:10</button>
    <button id="demoNight" aria-pressed="false">Noc 23:40</button>
    <button id="simNext" class="sim" hidden>▶ Idem ďalej</button>
    <button id="simBad" hidden>↺ Idem zle</button>
    <button id="simLate" hidden>⏱ Meškám</button>
  </div>

  <div class="phone" id="phone">
    <!-- 1. DOMOV -->
    <section class="screen" id="scrHome">
      <header class="bar-top">
        <h1>Kam ideš?</h1>
        <div class="clock"><span id="clock">7:10</span><br>štvrtok</div>
      </header>
      <div class="scroll">
        <div class="tiles">
          <button class="tile wide t-home" data-tile="domov"><span class="ico" aria-hidden="true">🏠</span><span class="txt"><span class="name">Domov</span><span class="sub">Sibírska</span></span></button>
          <button class="tile t-school" data-tile="skola"><span class="ico" aria-hidden="true">🏫</span><span class="name">Škola</span><span class="sub">Trojica</span></button>
          <button class="tile t-doc" data-tile="lekar"><span class="ico" aria-hidden="true">🏥</span><span class="name">Lekár</span><span class="sub">Fakultná nemocnica</span></button>
          <button class="tile t-gran" data-tile="babka"><span class="ico" aria-hidden="true">👵</span><span class="name">Babka</span><span class="sub">Solivar</span></button>
          <button class="tile t-shop" data-tile="obchod"><span class="ico" aria-hidden="true">🛒</span><span class="name">Obchod</span><span class="sub">Eperia</span></button>
        </div>
        <button class="row-btn" id="btnOther"><span class="ico" aria-hidden="true">🔎</span><span>Iné miesto<small>vyber zo zoznamu</small></span></button>
        <button class="row-btn" id="btnParent"><span class="ico" aria-hidden="true">⚙️</span><span>Nastavenia<small>pre rodiča alebo pomocníka</small></span></button>
      </div>
    </section>

    <!-- 2. PLÁN – jedna odpoveď -->
    <section class="screen" id="scrPlan" hidden>
      <header class="bar-top">
        <button class="btn-text" data-go="home">← Späť</button>
        <h1 id="planTitle"></h1>
      </header>
      <div class="scroll" id="planBody"></div>
      <div class="actions" id="planActions"></div>
    </section>

    <!-- 3. SPREVÁDZANIE -->
    <section class="screen" id="scrGuide" hidden>
      <header class="bar-top">
        <h1 id="guideTitle"></h1>
        <button class="btn-text" id="btnSpeak" aria-label="Prečítať pokyn nahlas">🔊 Čítaj</button>
      </header>
      <div class="dots" id="dots" aria-hidden="true"></div>
      <div class="scroll" id="guideBody" aria-live="polite"></div>
      <div class="actions" id="guideActions"></div>
    </section>

    <!-- 4. INÉ MIESTO -->
    <section class="screen" id="scrOther" hidden>
      <header class="bar-top">
        <button class="btn-text" data-go="home">← Späť</button>
        <h1>Iné miesto</h1>
      </header>
      <div class="scroll">
        <p style="margin:.2rem 0 .6rem;font-weight:700">Kam chceš ísť? Ťukni na miesto.</p>
        <button class="row-btn" data-tile="skola"><span class="ico" aria-hidden="true">⛪</span><span>Trojica<small>centrum mesta</small></span></button>
        <button class="row-btn" data-tile="lekar"><span class="ico" aria-hidden="true">🏥</span><span>Fakultná nemocnica<small>nemocnica</small></span></button>
        <button class="row-btn" data-tile="babka"><span class="ico" aria-hidden="true">🏘️</span><span>Solivar<small>mestská časť</small></span></button>
        <button class="row-btn" data-tile="obchod"><span class="ico" aria-hidden="true">🛒</span><span>Eperia<small>nákupné centrum</small></span></button>
        <p class="note">V hotovej appke tu bude veľké pole na písanie s odpúšťaním preklepov („nemocnca“ nájde nemocnicu) a zoznam naposledy použitých miest.</p>
      </div>
    </section>

    <!-- lišta pomoci: na každej obrazovke -->
    <nav class="help" aria-label="Pomoc">
      <button id="btnWhere"><span class="ico" aria-hidden="true">📍</span><span>Kde som?</span></button>

    steps.push(`<li><span class="ico" aria-hidden="true">🚌</span><div><div class="main">Nastúp do autobusu <span class="line-badge">${r.line}</span> o ${r.board}</div><div class="sub">Vpredu má napísané: <b>${r.sign}</b></div></div></li>`);
    steps.push(`<li><span class="ico" aria-hidden="true">🔔</span><div><div class="main">Vystúp na zastávke ${r.out}</div><div class="sub">Je to ${r.nth}. zastávka · o ${r.outAt}${r.request ? ' · pred ňou <b>stlač STOP</b>' : ''}</div></div></li>`);

    } else phase++;
    left = 0; renderGuide();
  };
  const on1 = (id, fn) => { const e = $(id); if (e) e.onclick = fn; };
  on1('wGo', () => { introSeen = true; wk.mode = 'walk'; renderGuide(); });
  on1('wView', () => { wk.view = wk.view === 'map' ? 'arrow' : 'map'; renderGuide(); });
  on1('wHere', hereTap);
  on1('cYes', () => toWait(true));
  // „Nie“: stojí na inom nástupišti → vysvetliť a doviesť; druhé „Nie“ po oprave už nikam neposiela
  on1('cNo', () => { wk.mode = wk.fix ? 'unsure' : 'nofix'; renderGuide(); });
  on1('cIdk', () => { wk.mode = 'unsure'; renderGuide(); });
  on1('fGo', () => { startWalk(wk.id, wk.w.cue.ref); renderGuide(); });
  on1('uOk', () => toWait(false));
  on1('uCall', callSheet);
  on1('gMiss', () => {
    const li = rideIdx === 0 ? laterOpt() : -1;
    if (li >= 0) {
      sheet(`<div class="big-msg"><div class="ico" aria-hidden="true">🙂</div><h2>Nič sa nedeje</h2><p>Nájdem ti ďalší autobus.</p></div><div class="stack"><button class="primary" id="mOk">Ukáž ďalší autobus</button></div>`);
      $('mOk').onclick = () => { closeSheet(); optIdx = li; wk = null; renderPlan(); show('scrPlan'); };
    } else sheet(`<div class="big-msg"><div class="ico" aria-hidden="true">🙂</div><h2>Nič sa nedeje</h2><p>Appka by ti teraz našla ďalší autobus z miesta, kde stojíš.</p></div><p class="note">V ukážke sú pripravené len dva spoje z domu.</p><div class="stack"><button class="primary" data-close>Dobre</button></div>`);
  });
  on1('gEnd', () => {
    sheet(`<h2>Naozaj ukončiť cestu?</h2><p>Prestanem ťa sprevádzať a <b>nezazvoním pred výstupom</b>.</p><div class="stack"><button class="primary" data-close>Nie, pokračovať v ceste</button><button class="secondary danger" id="eYes">Áno, ukončiť</button></div>`);
    $('eYes').onclick = () => { closeSheet(); left = 0; wk = null; show('scrHome'); };
  });
  simBar();
}
function exitAlert(r, last) {
  $('alertT').textContent = last ? 'VYSTÚP NA ĎALŠEJ ZASTÁVKE' : 'PRESADNUTIE NA ĎALŠEJ ZASTÁVKE';
  $('alertP').textContent = `Vystúp: ${r.out}.${r.request ? ' Stlač tlačidlo STOP.' : ''}`;
  $('alert').hidden = false; $('alertOk').focus(); simBar();
  if (navigator.vibrate) navigator.vibrate([400, 200, 400]);
}
$('alertOk').onclick = () => { $('alert').hidden = true; left = 0; phase = 3; renderGuide(); };

// ── pomoc: Kde som? / Zavolať ──
function callSheet() {
  sheet(`<h2>📞 Zavolať mame?</h2><p>Číslo nastavil rodič v Nastaveniach.</p><div class="stack"><button class="primary" data-close>Áno, zavolať</button><button class="secondary" data-close>Nie</button></div><p class="note">V ukážke sa nevolá. V appke sa otvorí telefón s uloženým číslom; volanie potvrdíš ešte raz tam.</p>`);
}
$('btnCall').onclick = callSheet;
$('btnWhere').onclick = () => {
  const where = night ? { s: 'Cemjata', u: 'pri zastávke Cemjata' } : { s: 'Sibírska', u: 'na ulici Tekeľova' };
  sheet(`<h2>📍 Tu si</h2><p>Najbližšia zastávka: <b>${where.s}</b></p><p>Si ${where.u}, Prešov.</p><div class="stack"><button class="primary" id="wHome">🏠 Chcem ísť domov</button><button class="secondary" id="wCall">📞 Zavolať mame</button><button class="secondary" data-close>Zavrieť</button></div><p class="note">Poloha zostáva v telefóne. Nikam sa neposiela.</p>`);
  $('wHome').onclick = () => { closeSheet(); openTile('domov'); };
  $('wCall').onclick = callSheet;
};

// ── iné miesto, nastavenia pre rodiča ──
$('btnOther').onclick = () => night ? nightMsg() : show('scrOther');
$('btnParent').onclick = () => {
  sheet(`<h2>⚙️ Len pre dospelých</h2><p>Koľko je <b>7 × 8</b>?</p><div class="field"><input id="gate" inputmode="numeric" autocomplete="off" aria-label="Výsledok"></div><div class="stack"><button class="primary" id="gateOk">Pokračovať</button><button class="secondary" data-close>Späť</button></div><p class="note" id="gateMsg">Nastavenia sú chránené, aby ich dieťa nezmenilo omylom.</p>`);
  $('gateOk').onclick = () => {
    if ($('gate').value.trim() !== '56') { $('gateMsg').textContent = 'To nie je správne. Skús to znova.'; return; }
    sheet(`<h2>Nastavenia jednoduchého režimu</h2>
      <label class="field">Tempo chôdze<select><option>Pomalšie (odporúčané)</option><option>Bežné</option></select></label>
      <label class="field">Presadanie<select><option>Len keď inak nejde, aspoň 3 minúty času</option><option>Vôbec nepresadať</option><option>Povoliť, aspoň 2 minúty času</option></select></label>
      <label class="field">Najviac pešo k zastávke<select><option>400 m</option><option>700 m</option><option>1 km</option></select></label>
      <label class="field">Oslovenie<select><option>Tykať (deti)</option><option>Vykať (dospelí a seniori)</option></select></label>
      <label class="field">Telefón na tlačidlo „Zavolať“<input type="tel" placeholder="číslo rodiča alebo opatrovateľa" autocomplete="off"></label>
      <label class="field">Meno na tlačidle „Zavolať“<input placeholder="napr. mame, dcére, synovi" autocomplete="off"></label>
      <label class="field">Veľkosť písma<select><option>Veľké</option><option>Najväčšie</option></select></label>
      <div class="stack"><button class="secondary">Upraviť ciele (Domov, Škola…)</button><button class="secondary">Vypnúť jednoduchý režim</button><button class="primary" data-close>Hotovo</button></div>
      <p class="note">Ukážka: voľby sa neukladajú. V jednoduchom režime nie je nákup Plus ani platená SMS.</p>`);
  };
};

// ── prepínač ukážky ──
function setNight(n) { night = n; $('demoDay').setAttribute('aria-pressed', String(!n)); $('demoNight').setAttribute('aria-pressed', String(n)); $('clock').textContent = n ? '23:40' : '7:10'; closeSheet(); $('alert').hidden = true; show('scrHome'); }
$('demoDay').onclick = () => setNight(false);
$('demoNight').onclick = () => setNight(true);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });
</script>
